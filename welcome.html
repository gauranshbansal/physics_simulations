<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauransh Bansal Labs — Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030506; font-family: 'Inter', sans-serif; color: #f8fafc; }
</style>
</head>
<body>
  <!-- Fullscreen Welcome Gate: Gauransh Bansal Labs (Pure sech2 Soliton Field) -->
  <style>
    #welcomeScreen {
      position: fixed; inset: 0; z-index: 9999; background: #030506;
      display: flex; flex-direction: column; overflow: hidden;
      transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.75s ease, filter 0.75s ease;
      touch-action: none;
    }
    #welcomeScreen.dismissed {
      transform: scale(1.08);
      opacity: 0;
      filter: blur(14px) brightness(1.3);
      pointer-events: none;
    }
    #welcomeFieldCanvas {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    }
    .wb-enter-shelf {
      position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      pointer-events: auto; z-index: 25; opacity: 0;
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .wb-enter-shelf.revealed {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
    .wb-enter-btn {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(129, 140, 248, 0.20));
      border: 1px solid rgba(56, 189, 248, 0.45); color: #ffffff; padding: 13px 32px; border-radius: 999px;
      font-size: 13px; font-weight: 600; font-family: 'Fira Code', monospace; letter-spacing: 0.08em;
      cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px); transition: all 0.25s ease;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .wb-enter-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 40px rgba(56, 189, 248, 0.45), 0 0 24px rgba(56, 189, 248, 0.5);
      border-color: #38bdf8;
    }
    .wb-enter-btn:active {
      transform: translateY(0) scale(0.98);
    }
    @media (max-width: 680px) {
      .wb-enter-shelf { bottom: 28px; width: 88%; }
      .wb-enter-btn { width: 100%; justify-content: center; padding: 13px 20px; font-size: 12px; }
    }
  </style>

  <canvas id="cavitationCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999998;"></canvas>
  <div id="welcomeScreen">
    <canvas id="welcomeFieldCanvas" aria-label="Flowing topographic lines forming Gauransh Bansal Labs"></canvas>

    <div class="wb-enter-shelf" id="wbEnterShelf">
      <button class="wb-enter-btn" id="wbEnterBtn">
        <span>ENTER SIMULATIONS LIBRARY</span>
        <span style="color:#38bdf8;">➔</span>
      </button>
    </div>
  </div>
  <script>
  (() => {
    const welcomeScreen = document.getElementById('welcomeScreen');
    const canvas = document.getElementById('welcomeFieldCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const enterShelf = document.getElementById('wbEnterShelf');
    const enterBtn = document.getElementById('wbEnterBtn');

    const mask = document.createElement('canvas');
    const mctx = mask.getContext('2d', { willReadFrequently: true });
    let W = 0, H = 0, D = 1, pixels;
    let time = 0, last = 0, raf = 0, reveal = 0;
    let px = -9999, py = -9999;
    let pointerInside = false;
    let dismissed = false;

    // Active KdV Solitons & Small Quick EXP 27A Shockwaves
    let solitons = [];
    let shocks = [];

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

    function drawSpacedText(str, x, y, extraSpace, align) {
      if ('letterSpacing' in mctx) {
        mctx.letterSpacing = `${extraSpace}px`;
        mctx.textAlign = align;
        mctx.fillText(str, x, y);
        return;
      }
      const chars = str.split('');
      const widths = [];
      let totalW = 0;
      for (let i = 0; i < chars.length; i++) {
        const w = mctx.measureText(chars[i]).width;
        widths.push(w);
        totalW += w + (i < chars.length - 1 ? extraSpace : 0);
      }
      let curX = align === 'center' ? x - totalW / 2 : (align === 'right' ? x - totalW : x);
      mctx.textAlign = 'left';
      for (let i = 0; i < chars.length; i++) {
        mctx.fillText(chars[i], curX, y);
        curX += widths[i] + extraSpace;
      }
    }

    function measureSpacedText(str, extraSpace) {
      if ('letterSpacing' in mctx) {
        mctx.letterSpacing = `${extraSpace}px`;
        return mctx.measureText(str).width;
      }
      let totalW = 0;
      for (let i = 0; i < str.length; i++) {
        totalW += mctx.measureText(str[i]).width + (i < str.length - 1 ? extraSpace : 0);
      }
      return totalW;
    }

    function makeMask() {
      mask.width = Math.ceil(W);
      mask.height = Math.ceil(H);
      mctx.clearRect(0, 0, W, H);

      const narrow = W < 768;
      // High-impact typography: optimized for mobile resolution
      let titleSize = Math.min(W * (narrow ? 0.106 : 0.092), H * (narrow ? 0.095 : 0.170));
      let labsSize  = Math.min(W * (narrow ? 0.160 : 0.135), H * (narrow ? 0.140 : 0.230));
      let extraSpace = Math.max(2, Math.round(titleSize * (narrow ? 0.05 : 0.08)));

      mctx.fillStyle = '#ffffff';
      mctx.font = `900 ${titleSize}px Impact, "Arial Black", "Arial Narrow", sans-serif`;
      let wTitle = measureSpacedText('GAURANSH BANSAL', extraSpace);

      const maxAllowedW = W * (narrow ? 0.91 : 0.88);
      if (wTitle > maxAllowedW) {
        const scale = maxAllowedW / wTitle;
        titleSize *= scale;
        labsSize *= scale;
        extraSpace = Math.max(1, Math.round(titleSize * (narrow ? 0.04 : 0.07)));
        mctx.font = `900 ${titleSize}px Impact, "Arial Black", "Arial Narrow", sans-serif`;
        wTitle = measureSpacedText('GAURANSH BANSAL', extraSpace);
      }

      const startX = (W - wTitle) / 2;
      const endX = startX + wTitle;

      mctx.textBaseline = 'middle';
      const line1Y = narrow ? H * 0.42 : H * 0.40;
      const line2Y = narrow ? H * 0.54 : H * 0.60;
      // Line 1: GAURANSH BANSAL
      drawSpacedText('GAURANSH BANSAL', startX, line1Y, extraSpace, 'left');

      // Line 2: LABS right aligned
      mctx.font = `900 ${labsSize}px Impact, "Arial Black", "Arial Narrow", sans-serif`;
      const labsSpace = Math.max(3, Math.round(labsSize * 0.10));
      drawSpacedText('LABS', endX, line2Y, labsSpace, 'right');

      const raw = mctx.getImageData(0, 0, mask.width, mask.height);
      pixels = raw.data;
    }

    function resize() {
      const rect = welcomeScreen.getBoundingClientRect();
      W = rect.width; H = rect.height;
      D = Math.min(window.devicePixelRatio || 1, 1.35);
      canvas.width = Math.round(W * D);
      canvas.height = Math.round(H * D);
      ctx.setTransform(D, 0, 0, D, 0, 0);
      makeMask();
      const isMobile = (W <= 820) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
      if (isMobile) {
        reveal = 1.0;
        if (enterShelf) enterShelf.classList.add('revealed');
      }
    }

    function maskAlpha(x, y) {
      const ix = x | 0, iy = y | 0;
      if (ix < 0 || iy < 0 || ix >= mask.width || iy >= mask.height) return 0;
      return pixels[(iy * mask.width + ix) * 4 + 3];
    }

    let v1, v2, v3;
    function updateVortices() {
      v1 = [W * 0.20, H * 0.29, W * 0.20,  1.0,  (W * 0.20) * (W * 0.20) * 0.16, 1 / ((W * 0.20) * (W * 0.20) * 1.8)];
      v2 = [W * 0.79, H * 0.54, W * 0.17, -0.85, (W * 0.17) * (W * 0.17) * 0.16, 1 / ((W * 0.17) * (W * 0.17) * 1.8)];
      v3 = [W * 0.46, H * 0.88, W * 0.25,  0.65, (W * 0.25) * (W * 0.25) * 0.16, 1 / ((W * 0.25) * (W * 0.25) * 1.8)];
    }

    function flow(x, y, t) {
      const nx = x / W, ny = y / H;
      let dx = 0, dy = 0;

      const vorList = [v1, v2, v3];
      for (let i = 0; i < 3; i++) {
        const v = vorList[i];
        const ax = x - v[0], ay = y - v[1];
        const d2 = ax * ax + ay * ay;
        const rr = d2 + v[4];
        const influence = Math.exp(-d2 * v[5]) * v[3];
        const invR = 1 / Math.sqrt(rr);
        dx += (-ay * invR) * influence * 24;
        dy += ( ax * invR) * influence * 24;
      }

      dx += Math.sin(ny * 9.0 + t * 0.55) * 13 + Math.sin((nx + ny) * 7.0 - t * 0.3) * 7;
      dy += Math.sin(nx * 8.0 - t * 0.42) * 13 + Math.cos((nx - ny) * 6.0 + t * 0.25) * 8;

      const sLen = solitons.length;
      if (sLen > 0) {
        for (let i = 0; i < sLen; i++) {
          const s = solitons[i];
          const ax = x - s.x, ay = y - s.y;
          const dist = Math.hypot(ax, ay);
          const diff = Math.abs(dist - s.radius);
          if (diff < 35) {
            const u = diff * s.kappa;
            const c = Math.cosh(u);
            const sech2 = 1 / (c * c);
            const elevation = 2 * Math.pow(s.kappa * 15, 2) * sech2 * s.amp;
            const invDist = 1 / Math.max(1, dist);
            dx += (ax * invDist) * elevation * 0.38;
            dy += (ay * invDist) * elevation * 0.38;
          }
        }
      }

      return [dx, dy];
    }

    function color(y) {
      const p = y / H;
      let r, g, b;
      if (p < 0.47) {
        r = 255; g = Math.round(72 + p * 340); b = 20;
      } else if (p < 0.76) {
        r = Math.round(255 - (p - 0.47) * 720); g = 225; b = Math.round(40 + (p - 0.47) * 610);
      } else {
        r = 0; g = Math.round(210 - (p - 0.76) * 250); b = 255;
      }
      return [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255)];
    }

    let ptsX = new Float32Array(800);
    let ptsY = new Float32Array(800);

    function draw(now) {
      if (dismissed) return;
      if (now - last < 16 && !reduced) { raf = requestAnimationFrame(draw); return; }
      const dt = Math.min((now - last) / 1000, 0.04);
      last = now;
      if (!reduced) time += dt;

      for (let i = solitons.length - 1; i >= 0; i--) {
        const s = solitons[i];
        s.radius += s.speed;
        s.amp *= 0.982;
        if (s.amp < 0.05 || s.radius > Math.max(W, H) * 1.1) solitons.splice(i, 1);
      }

      // Detect mobile mode: screen width <= 820 or touch screen devices
      const isMobile = (W > 0 && W <= 820) || 
                       (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
                       ('ontouchstart' in window);

      // On mobile view: name is visible by default (target = 1) because mobile has no cursor hover.
      // On desktop: target responds dynamically to mouse pointer hover.
      const target = isMobile ? 1.0 : (pointerInside ? 1.0 : 0.0);
      reveal += (target - reveal) * (reduced ? 1.0 : 1.0 - Math.exp(-dt * 5.2));

      ctx.fillStyle = '#030506';
      ctx.fillRect(0, 0, W, H);

      // --- DYNAMIC LINE DENSITY (Substantially denser lines on mobile for razor-sharp legibility) ---
      // On mobile viewports, letters have smaller pixel heights, requiring tightly spaced streamlines
      // so each glyph is rendered across 10-14 lines rather than 3-4 lines.
      const spacing = isMobile ? Math.max(3.8, Math.min(5.2, H / 170)) : Math.max(8.5, Math.min(11.5, H / 75));
      const count = Math.ceil(H / spacing);
      const step = isMobile ? Math.max(2.0, Math.min(3.0, W / 160)) : Math.max(3.2, Math.min(4.8, W / 260));

      // Generous overshoot margin so lines never end near the corners or edges of the screen
      const padX = Math.max(120, Math.ceil(W * 0.22));
      const padY = Math.max(120, Math.ceil(H * 0.22));

      const numSteps = Math.ceil((W + padX * 2) / step) + 16;
      if (ptsX.length < numSteps + 4) {
        ptsX = new Float32Array(numSteps + 16);
        ptsY = new Float32Array(numSteps + 16);
      }

      const hasReveal = reveal > 0.003;
      const minWH = Math.min(W, H);
      const pFieldRadius = minWH * 0.03;
      const pFieldInv = 1 / (minWH * 0.15);

      const rowMin = -Math.ceil(padY / spacing) - 2;
      const rowMax = count + Math.ceil(padY / spacing) + 2;

      for (let row = rowMin; row <= rowMax; row++) {
        const base = row * spacing;
        const col = color(base);

        let ptIdx = 0;
        for (let x = -padX; x <= W + padX; x += step) {
          const [dx, dy] = flow(x, base, time);
          ptsX[ptIdx] = x + dx;
          ptsY[ptIdx] = base + dy;
          ptIdx++;
        }

        // Pass 1: Background streamline with natural contrast modulation
        ctx.beginPath();
        ctx.moveTo(ptsX[0], ptsY[0]);
        for (let j = 1; j < ptIdx; j++) {
          ctx.lineTo(ptsX[j], ptsY[j]);
        }
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const bgAlpha = isMobile 
          ? Math.max(0.12, 0.40 * (1 - reveal * 0.65)) 
          : Math.max(0.18, 0.62 * (1 - reveal * 0.65));
        ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${bgAlpha})`;
        ctx.lineWidth = isMobile ? 0.85 : 1.05;
        ctx.stroke();

        // Pass 2: Re-trace text mask with sub-stepping & stem continuity
        if (hasReveal) {
          ctx.beginPath();
          let active = false;
          let segLen = 0;
          let lastX = 0, lastY = 0;

          for (let j = 0; j < ptIdx; j++) {
            const xx = ptsX[j], yy = ptsY[j];
            const a = maskAlpha(xx, yy);

            let strength = 0;
            if (a > 20) {
              strength = (a / 255) * reveal;
            } else {
              const radius = Math.hypot(px - xx, py - yy);
              const pointerField = 1 - smooth((radius - pFieldRadius) * pFieldInv);
              strength = reveal * pointerField * 0.14;
            }

            if (strength > 0.12) {
              if (!active) {
                ctx.moveTo(xx, yy);
                active = true;
                segLen = 1;
              } else {
                ctx.lineTo(xx, yy);
                segLen++;
              }
              lastX = xx; lastY = yy;
            } else if (active) {
              active = false;
              if (segLen === 1) ctx.lineTo(lastX + (isMobile ? 1.2 : 1.6), lastY);
              ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.65 + 0.35 * reveal})`;
              ctx.lineWidth = isMobile ? (2.2 + 0.6 * reveal) : (1.8 + 1.4 * reveal);
              ctx.stroke();
              ctx.beginPath();
              segLen = 0;
            }
          }
          if (active) {
            if (segLen === 1) ctx.lineTo(lastX + (isMobile ? 1.2 : 1.6), lastY);
            ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.65 + 0.35 * reveal})`;
            ctx.lineWidth = isMobile ? (2.2 + 0.6 * reveal) : (1.8 + 1.4 * reveal);
            ctx.stroke();
          }
        }
      }

      // Cavitation is handled on cavitationCanvas with clock-based precision

      if (reveal > 0.35) enterShelf.classList.add('revealed');

      raf = requestAnimationFrame(draw);
    }

    // Ambient fade in for center enter button after 2.2s
    setTimeout(() => {
      if (enterShelf) enterShelf.classList.add('revealed');
    }, 2200);

    // Pointer & Touch Interaction
    welcomeScreen.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return; // On touch devices, name is always visible by default
      const r = welcomeScreen.getBoundingClientRect();
      px = e.clientX - r.left;
      py = e.clientY - r.top;
      pointerInside = Math.hypot(px - W / 2, py - H * 0.50) < Math.min(W, H) * 0.44;
    });

    welcomeScreen.addEventListener('pointerleave', () => {
      pointerInside = false;
      px = -9999; py = -9999;
    });

    function dismissWelcome() {
      if (dismissed) return;
      dismissed = true;
      
      welcomeScreen.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 600);
    }

    enterBtn.addEventListener('click', e => {
      e.stopPropagation();
      dismissWelcome();
    });

    // === Scroll to Open Feature (Mouse Wheel & Mobile Touch Swipe) ===
    window.addEventListener('wheel', e => {
      if (!dismissed && e.deltaY > 15) {
        dismissWelcome();
      }
    }, { passive: true });

    let touchStartY = null;
    window.addEventListener('touchstart', e => {
      if (e.touches && e.touches.length > 0) {
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchmove', e => {
      if (!dismissed && touchStartY !== null && e.touches && e.touches.length > 0) {
        const diffY = touchStartY - e.touches[0].clientY;
        if (diffY > 35) { // Swiped up / scrolled down
          dismissWelcome();
        }
      }
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (!dismissed && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown' || e.key === 'PageDown')) {
        dismissWelcome();
      }
    });

    window.addEventListener('resize', () => { resize(); updateVortices(); });
    resize(); updateVortices(); raf = requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
