  <script>
  (() => {
    const welcomeScreen = document.getElementById('welcomeScreen');
    const canvas = document.getElementById('welcomeFieldCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const enterShelf = document.getElementById('wbEnterShelf');
    const enterBtn = document.getElementById('wbEnterBtn');

    const mask = document.createElement('canvas');
    const mctx = mask.getContext('2d', { willReadFrequently: true });
    let W = 0, H = 0, D = 1, pixels;
    let time = 0, last = 0, raf = 0, reveal = 0;
    let px = -9999, py = -9999;
    let pointerInside = false;
    let dismissed = false;

    // Active KdV Solitons & Small Quick EXP 27A Shockwaves
    let solitons = [];
    let shocks = [];

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

    function drawSpacedText(str, x, y, extraSpace, align) {
      if ('letterSpacing' in mctx) {
        mctx.letterSpacing = `${extraSpace}px`;
        mctx.textAlign = align;
        mctx.fillText(str, x, y);
        return;
      }
      const chars = str.split('');
      const widths = [];
      let totalW = 0;
      for (let i = 0; i < chars.length; i++) {
        const w = mctx.measureText(chars[i]).width;
        widths.push(w);
        totalW += w + (i < chars.length - 1 ? extraSpace : 0);
      }
      let curX = align === 'center' ? x - totalW / 2 : (align === 'right' ? x - totalW : x);
      mctx.textAlign = 'left';
      for (let i = 0; i < chars.length; i++) {
        mctx.fillText(chars[i], curX, y);
        curX += widths[i] + extraSpace;
      }
    }

    function measureSpacedText(str, extraSpace) {
      if ('letterSpacing' in mctx) {
        mctx.letterSpacing = `${extraSpace}px`;
        return mctx.measureText(str).width;
      }
      let totalW = 0;
      for (let i = 0; i < str.length; i++) {
        totalW += mctx.measureText(str[i]).width + (i < str.length - 1 ? extraSpace : 0);
      }
      return totalW;
    }

    function makeMask() {
      mask.width = Math.ceil(W);
      mask.height = Math.ceil(H);
      mctx.clearRect(0, 0, W, H);

      const narrow = W < 768;
      // High-impact, enlarged typography
      let titleSize = Math.min(W * (narrow ? 0.096 : 0.092), H * 0.170);
      let labsSize  = Math.min(W * (narrow ? 0.145 : 0.135), H * 0.230);
      let extraSpace = Math.max(3, Math.round(titleSize * 0.08));

      mctx.fillStyle = '#ffffff';
      mctx.font = `900 ${titleSize}px Impact, "Arial Black", "Arial Narrow", sans-serif`;
      let wTitle = measureSpacedText('GAURANSH BANSAL', extraSpace);

      if (wTitle > W * 0.88) {
        const scale = (W * 0.88) / wTitle;
        titleSize *= scale;
        labsSize *= scale;
        extraSpace = Math.max(2, Math.round(titleSize * 0.07));
        mctx.font = `900 ${titleSize}px Impact, "Arial Black", "Arial Narrow", sans-serif`;
        wTitle = measureSpacedText('GAURANSH BANSAL', extraSpace);
      }

      const startX = (W - wTitle) / 2;
      const endX = startX + wTitle;

      mctx.textBaseline = 'middle';
      // Line 1: GAURANSH BANSAL
      drawSpacedText('GAURANSH BANSAL', startX, H * 0.40, extraSpace, 'left');

      // Line 2: LABS right aligned
      mctx.font = `900 ${labsSize}px Impact, "Arial Black", "Arial Narrow", sans-serif`;
      const labsSpace = Math.max(3, Math.round(labsSize * 0.10));
      drawSpacedText('LABS', endX, H * 0.60, labsSpace, 'right');

      const raw = mctx.getImageData(0, 0, mask.width, mask.height);
      pixels = raw.data;
    }

    function resize() {
      const rect = welcomeScreen.getBoundingClientRect();
      W = rect.width; H = rect.height;
      D = Math.min(window.devicePixelRatio || 1, 1.35);
      canvas.width = Math.round(W * D);
      canvas.height = Math.round(H * D);
      ctx.setTransform(D, 0, 0, D, 0, 0);
      makeMask();
    }

    function maskAlpha(x, y) {
      const ix = x | 0, iy = y | 0;
      if (ix < 0 || iy < 0 || ix >= mask.width || iy >= mask.height) return 0;
      return pixels[(iy * mask.width + ix) * 4 + 3];
    }

    let v1, v2, v3;
    function updateVortices() {
      v1 = [W * 0.20, H * 0.29, W * 0.20,  1.0,  (W * 0.20) * (W * 0.20) * 0.16, 1 / ((W * 0.20) * (W * 0.20) * 1.8)];
      v2 = [W * 0.79, H * 0.54, W * 0.17, -0.85, (W * 0.17) * (W * 0.17) * 0.16, 1 / ((W * 0.17) * (W * 0.17) * 1.8)];
      v3 = [W * 0.46, H * 0.88, W * 0.25,  0.65, (W * 0.25) * (W * 0.25) * 0.16, 1 / ((W * 0.25) * (W * 0.25) * 1.8)];
    }

    function flow(x, y, t) {
      const nx = x / W, ny = y / H;
      let dx = 0, dy = 0;

      const vorList = [v1, v2, v3];
      for (let i = 0; i < 3; i++) {
        const v = vorList[i];
        const ax = x - v[0], ay = y - v[1];
        const d2 = ax * ax + ay * ay;
        const rr = d2 + v[4];
        const influence = Math.exp(-d2 * v[5]) * v[3];
        const invR = 1 / Math.sqrt(rr);
        dx += (-ay * invR) * influence * 24;
        dy += ( ax * invR) * influence * 24;
      }

      dx += Math.sin(ny * 9.0 + t * 0.55) * 13 + Math.sin((nx + ny) * 7.0 - t * 0.3) * 7;
      dy += Math.sin(nx * 8.0 - t * 0.42) * 13 + Math.cos((nx - ny) * 6.0 + t * 0.25) * 8;

      const sLen = solitons.length;
      if (sLen > 0) {
        for (let i = 0; i < sLen; i++) {
          const s = solitons[i];
          const ax = x - s.x, ay = y - s.y;
          const dist = Math.hypot(ax, ay);
          const diff = Math.abs(dist - s.radius);
          if (diff < 35) {
            const u = diff * s.kappa;
            const c = Math.cosh(u);
            const sech2 = 1 / (c * c);
            const elevation = 2 * Math.pow(s.kappa * 15, 2) * sech2 * s.amp;
            const invDist = 1 / Math.max(1, dist);
            dx += (ax * invDist) * elevation * 0.38;
            dy += (ay * invDist) * elevation * 0.38;
          }
        }
      }

      return [dx, dy];
    }

    function color(y) {
      const p = y / H;
      let r, g, b;
      if (p < 0.47) {
        r = 255; g = Math.round(72 + p * 340); b = 20;
      } else if (p < 0.76) {
        r = Math.round(255 - (p - 0.47) * 720); g = 225; b = Math.round(40 + (p - 0.47) * 610);
      } else {
        r = 0; g = Math.round(210 - (p - 0.76) * 250); b = 255;
      }
      return [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255)];
    }

    let ptsX = new Float32Array(800);
    let ptsY = new Float32Array(800);

    function draw(now) {
      if (dismissed) return;
      if (now - last < 16 && !reduced) { raf = requestAnimationFrame(draw); return; }
      const dt = Math.min((now - last) / 1000, 0.04);
      last = now;
      if (!reduced) time += dt;

      for (let i = solitons.length - 1; i >= 0; i--) {
        const s = solitons[i];
        s.radius += s.speed;
        s.amp *= 0.982;
        if (s.amp < 0.05 || s.radius > Math.max(W, H) * 1.1) solitons.splice(i, 1);
      }

      const target = pointerInside ? 1 : 0;
      reveal += (target - reveal) * (reduced ? 1 : 1 - Math.exp(-dt * 5.2));

      ctx.fillStyle = '#030506';
      ctx.fillRect(0, 0, W, H);

      const spacing = Math.max(8.5, Math.min(11.5, H / 75));
      const count = Math.ceil(H / spacing);
      const step = Math.max(3.2, Math.min(4.8, W / 260));
      const numSteps = Math.ceil((W + step * 2) / step);

      if (ptsX.length < numSteps + 2) {
        ptsX = new Float32Array(numSteps + 4);
        ptsY = new Float32Array(numSteps + 4);
      }

      const hasReveal = reveal > 0.003;
      const minWH = Math.min(W, H);
      const pFieldRadius = minWH * 0.03;
      const pFieldInv = 1 / (minWH * 0.15);

      for (let row = -2; row <= count + 2; row++) {
        const base = row * spacing;
        const col = color(base);

        let ptIdx = 0;
        for (let x = -step; x <= W + step; x += step) {
          const [dx, dy] = flow(x, base, time);
          ptsX[ptIdx] = x + dx;
          ptsY[ptIdx] = base + dy;
          ptIdx++;
        }

        // Pass 1: Background streamline with natural contrast modulation
        ctx.beginPath();
        ctx.moveTo(ptsX[0], ptsY[0]);
        for (let j = 1; j < ptIdx; j++) {
          ctx.lineTo(ptsX[j], ptsY[j]);
        }
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const bgAlpha = Math.max(0.18, 0.62 * (1 - reveal * 0.65));
        ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${bgAlpha})`;
        ctx.lineWidth = 1.05;
        ctx.stroke();

        // Pass 2: Re-trace text mask with sub-stepping & stem continuity
        if (hasReveal) {
          ctx.beginPath();
          let active = false;
          let segLen = 0;
          let lastX = 0, lastY = 0;

          for (let j = 0; j < ptIdx; j++) {
            const xx = ptsX[j], yy = ptsY[j];
            const a = maskAlpha(xx, yy);

            let strength = 0;
            if (a > 20) {
              strength = (a / 255) * reveal;
            } else {
              const radius = Math.hypot(px - xx, py - yy);
              const pointerField = 1 - smooth((radius - pFieldRadius) * pFieldInv);
              strength = reveal * pointerField * 0.14;
            }

            if (strength > 0.12) {
              if (!active) {
                ctx.moveTo(xx, yy);
                active = true;
                segLen = 1;
              } else {
                ctx.lineTo(xx, yy);
                segLen++;
              }
              lastX = xx; lastY = yy;
            } else if (active) {
              active = false;
              if (segLen === 1) ctx.lineTo(lastX + 1.6, lastY);
              ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.65 + 0.35 * reveal})`;
              ctx.lineWidth = 1.8 + 1.4 * reveal;
              ctx.stroke();
              ctx.beginPath();
              segLen = 0;
            }
          }
          if (active) {
            if (segLen === 1) ctx.lineTo(lastX + 1.6, lastY);
            ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.65 + 0.35 * reveal})`;
            ctx.lineWidth = 1.8 + 1.4 * reveal;
            ctx.stroke();
          }
        }
      }

      // Handled globally by cavitationCanvas shockwave engine

      if (reveal > 0.35) enterShelf.classList.add('revealed');

      raf = requestAnimationFrame(draw);
    }

    // Ambient fade in for center enter button after 2.2s
    setTimeout(() => {
      if (enterShelf) enterShelf.classList.add('revealed');
    }, 2200);

    // =========================================================================
    // EXP 27A-style cavitation click: compact, snappy, single-canvas engine.
    // - One <canvas>, one rAF loop, time-based (identical speed on 60/120/144Hz)
    // - No DOM nodes, no CSS box-shadow transitions, no ctx.shadowBlur
    //   (those were the main sources of jank). Glow = cheap radial gradients.
    // =========================================================================
    const cavCanvas = document.getElementById('cavitationCanvas');
    const cavCtx = cavCanvas ? cavCanvas.getContext('2d') : null;
    let cavEvents = [];
    let cavRaf = null;
    let cavDpr = 1;

    // Timeline (ms): expand -> implosion -> flash + shockwave
    const T_EXPAND = 85, T_COLLAPSE = 35, T_SHOCK = 400, T_FLASH = 110;
    const T_BURST = T_EXPAND + T_COLLAPSE;
    const R_BUBBLE = 17, R_SHOCK = 62;

    const easeOut = q => 1 - Math.pow(1 - q, 3);
    const easeIn  = q => q * q * q;

    function resizeCavCanvas() {
      if (!cavCanvas) return;
      cavDpr = Math.min(window.devicePixelRatio || 1, 2);
      cavCanvas.width = Math.round(window.innerWidth * cavDpr);
      cavCanvas.height = Math.round(window.innerHeight * cavDpr);
      cavCtx.setTransform(cavDpr, 0, 0, cavDpr, 0, 0);
    }
    window.addEventListener('resize', resizeCavCanvas, { passive: true });
    resizeCavCanvas();

    function glow(x, y, r, a, cyanMix) {
      if (a <= 0.003 || r <= 0.5) return;
      const g = cavCtx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255,255,255,${a})`);
      g.addColorStop(cyanMix, `rgba(6,182,212,${a * 0.55})`);
      g.addColorStop(1, 'rgba(6,182,212,0)');
      cavCtx.fillStyle = g;
      cavCtx.beginPath();
      cavCtx.arc(x, y, r, 0, 6.2832);
      cavCtx.fill();
    }

    function renderCav(now) {
      cavRaf = null;
      const c = cavCtx;
      c.clearRect(0, 0, window.innerWidth, window.innerHeight);

      for (let i = cavEvents.length - 1; i >= 0; i--) {
        const ev = cavEvents[i];
        const age = now - ev.t0;
        if (age < 0) continue;
        if (age > T_BURST + T_SHOCK) { cavEvents.splice(i, 1); continue; }

        // ---- Bubble: expansion then violent implosion ----
        if (age < T_BURST) {
          let r, fillA, white;
          if (age < T_EXPAND) {
            const q = easeOut(age / T_EXPAND);
            r = 3 + (R_BUBBLE - 3) * q;
            fillA = 0.35; white = 0;
          } else {
            const q = easeIn((age - T_EXPAND) / T_COLLAPSE);
            r = R_BUBBLE - (R_BUBBLE - 1.2) * q;
            fillA = 0.35 + 0.65 * q; white = q;
          }
          c.globalCompositeOperation = 'lighter';
          glow(ev.x, ev.y, r * 2.4, 0.35 + 0.5 * white, 0.35);
          c.globalCompositeOperation = 'source-over';
          c.fillStyle = `rgba(${Math.round(120 + 135 * white)},${Math.round(220 + 35 * white)},255,${fillA * 0.55})`;
          c.beginPath(); c.arc(ev.x, ev.y, r, 0, 6.2832); c.fill();
          c.strokeStyle = 'rgba(255,255,255,0.92)';
          c.lineWidth = 1.5;
          c.stroke();
        }

        // ---- Sonoluminescent flash ----
        const fa = age - T_BURST;
        if (fa >= 0 && fa < T_FLASH) {
          const q = fa / T_FLASH;
          c.globalCompositeOperation = 'lighter';
          glow(ev.x, ev.y, 10 + 30 * easeOut(q), 1 - q, 0.25);
          c.globalCompositeOperation = 'source-over';
        }

        // ---- Radial shockwave ----
        if (fa >= 0) {
          const q = Math.min(fa / T_SHOCK, 1);
          const r = 5 + R_SHOCK * easeOut(q);
          const alpha = Math.pow(1 - q, 1.6);
          // soft halo (cheap replacement for shadowBlur)
          c.strokeStyle = `rgba(6,182,212,${alpha * 0.16})`;
          c.lineWidth = 5 * alpha + 1;
          c.beginPath(); c.arc(ev.x, ev.y, r, 0, 6.2832); c.stroke();
          // crisp primary ring
          c.strokeStyle = `rgba(6,182,212,${alpha * 0.95})`;
          c.lineWidth = 0.8 + 1.5 * alpha;
          c.beginPath(); c.arc(ev.x, ev.y, r, 0, 6.2832); c.stroke();
          // secondary rebound ring
          if (r > 16) {
            c.strokeStyle = `rgba(255,255,255,${alpha * 0.65})`;
            c.lineWidth = 0.8;
            c.beginPath(); c.arc(ev.x, ev.y, r * 0.65, 0, 6.2832); c.stroke();
          }
        }
      }

      if (cavEvents.length) cavRaf = requestAnimationFrame(renderCav);
      else c.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    window.triggerGlobalCavitation = function(clickX, clickY) {
      if (!cavCtx) return;
      if (cavEvents.length >= 8) cavEvents.shift();
      // t0 = event timestamp so the animation starts the instant of the click
      cavEvents.push({ x: clickX, y: clickY, t0: performance.now() });
      if (!cavRaf) cavRaf = requestAnimationFrame(renderCav);
    };

    // Pointer & Touch Interaction
    welcomeScreen.addEventListener('pointermove', e => {
      const r = welcomeScreen.getBoundingClientRect();
      px = e.clientX - r.left;
      py = e.clientY - r.top;
      pointerInside = Math.hypot(px - W / 2, py - H * 0.50) < Math.min(W, H) * 0.44;
    });

    welcomeScreen.addEventListener('pointerleave', () => {
      pointerInside = false;
      px = -9999; py = -9999;
    });

    // Global instantaneous tactile click response
    window.addEventListener('pointerdown', e => {
      window.triggerGlobalCavitation(e.clientX, e.clientY);
    }, { passive: true });

    function dismissWelcome() {
      if (dismissed) return;
      dismissed = true;
      
      welcomeScreen.classList.add('dismissed');
      setTimeout(() => {
        welcomeScreen.style.display = 'none';
      }, 750);
    
    }

    enterBtn.addEventListener('click', e => {
      e.stopPropagation();
      const rect = enterBtn.getBoundingClientRect();
      window.triggerGlobalCavitation(rect.left + rect.width / 2, rect.top + rect.height / 2);
      setTimeout(dismissWelcome, 240);
    });

    // === Scroll to Open Feature (Mouse Wheel & Mobile Touch Swipe) ===
    window.addEventListener('wheel', e => {
      if (!dismissed && e.deltaY > 15) {
        dismissWelcome();
      }
    }, { passive: true });

    let touchStartY = null;
    window.addEventListener('touchstart', e => {
      if (e.touches && e.touches.length > 0) {
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchmove', e => {
      if (!dismissed && touchStartY !== null && e.touches && e.touches.length > 0) {
        const diffY = touchStartY - e.touches[0].clientY;
        if (diffY > 35) { // Swiped up / scrolled down
          dismissWelcome();
        }
      }
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (!dismissed && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown' || e.key === 'PageDown')) {
        dismissWelcome();
      }
    });

    window.addEventListener('resize', () => { resize(); updateVortices(); });
    resize(); updateVortices(); raf = requestAnimationFrame(draw);
  })();
  </script>

        title: "4D MANIFOLD PROJECTION & RELATIVISTIC DYNAMICS",
        subtitle: "Higher-dimensional stereographic projections, geodesic particle flows, and phase-space sonification",
        badge: "Differential Geometry & Relativity",
        description: "A real-time four-dimensional dynamical systems simulator projecting Riemannian hypercubes, Hopf fibrations, and Schwarzschild event horizon geodesics with 12,000 relativistic nodes, 4K snapshot export, and Web Audio synthesis.",
        image: "./manifold_working.png",
        url: "./manifold_4d_projection.html",
        featured: false,
        tags: ["4D Geometry", "Differential Geometry", "General Relativity", "Web Audio API", "Singularities"],
        category: "Differential Geometry & Relativity",
        year: "2026"
      }
    ];

    // Setup state
    let activeCategory = 'all';
    let searchQuery = '';
    let viewMode = 'row'; // 'row' or 'grid'

    const featured = simulations.find(s => s.featured) || simulations[0];

    // Initial setup of static values
    document.getElementById('sim-count-badge').textContent = `${simulations.length} Simulation${simulations.length !== 1 ? 's' : ''}`;

    const allTags = new Set();
    simulations.forEach(s => s.tags.forEach(t => allTags.add(t)));
    const uniqueCategories = new Set(simulations.map(s => s.category).filter(Boolean));

    document.getElementById('statSims').textContent = simulations.length;
    document.getElementById('statTopics').textContent = uniqueCategories.size;
    document.getElementById('statTech').textContent = allTags.size;

    // Render Featured Hero
    if (featured) {
      document.getElementById('hero-image').src = featured.image;
      document.getElementById('hero-image').alt = featured.title;

      const tagsHtml = featured.tags.map(t =>
        `<span class="tag-pill px-2.5 py-1 rounded-full text-[10px] font-medium tracking-wider uppercase text-neutral-300">${t}</span>`
      ).join('');

      document.getElementById('hero-content').innerHTML = `
        <div class="opacity-0 animate-fade-in-up">
          <div class="inline-flex items-center gap-3 px-4 py-2 rounded-full bg-white/[0.03] border border-white/10 shadow-glass-edge-subtle backdrop-blur-md mb-6">
            <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
            <p class="text-[10px] font-medium tracking-[0.2em] uppercase text-neutral-300">Featured Simulation</p>
          </div>
          <h1 class="font-serif hero-title text-5xl sm:text-6xl lg:text-7xl font-medium tracking-tight leading-[0.9] mb-5 opacity-0 animate-fade-in-up delay-100">${featured.title}</h1>
          <p class="font-serif italic text-neutral-300 text-xl md:text-2xl max-w-2xl leading-relaxed mb-2 opacity-0 animate-fade-in-up delay-200">${featured.subtitle}</p>
          <p class="text-sm text-neutral-500 font-light leading-relaxed mb-6 max-w-lg opacity-0 animate-fade-in-up delay-200">${featured.description}</p>
          <div class="flex flex-wrap items-center gap-2 mb-8 opacity-0 animate-fade-in-up delay-300">
            ${tagsHtml}
            <span class="text-neutral-700 text-[10px]">·</span>
            <span class="text-[10px] font-mono tracking-wider text-neutral-500">${featured.year}</span>
          </div>
          <div class="flex items-center gap-4 opacity-0 animate-fade-in-up delay-400">
            <a href="${featured.url}" class="px-8 py-4 bg-white text-black text-sm font-semibold tracking-wide rounded-full shadow-button-physical hover:scale-105 hover:-translate-y-1 transition-all duration-spring inline-flex items-center gap-2.5">
              <iconify-icon icon="lucide:play" width="16"></iconify-icon>
              Launch Simulation
            </a>
          </div>
        </div>
      `;
    }

    // Function to render category filter tabs
    function renderFilterTabs() {
      const tabsContainer = document.getElementById('filter-tabs');
      const categories = ['all', ...uniqueCategories];
      
      tabsContainer.innerHTML = categories.map(cat => {
        const isActive = activeCategory === cat;
        const displayName = cat === 'all' ? 'All Topics' : cat;
        const activeClass = isActive 
          ? 'bg-white text-black font-semibold border-white' 
          : 'text-neutral-400 hover:text-white border-white/5 hover:border-white/10 bg-white/[0.02]';
          
        return `
          <button onclick="setCategory('${cat}')" class="px-4 py-2 text-xs rounded-full border transition-all duration-300 ${activeClass}">
            ${displayName}
          </button>
        `;
      }).join('');
    }

    // Function to change current category
    window.setCategory = function(category) {
      activeCategory = category;
      renderFilterTabs();
      renderSimulations();
    };

    // Function to toggle between horizontal row and grid layouts
    window.toggleViewMode = function() {
      viewMode = viewMode === 'row' ? 'grid' : 'row';
      const icon = document.getElementById('view-toggle-icon');
      if (viewMode === 'grid') {
        icon.setAttribute('icon', 'lucide:list');
      } else {
        icon.setAttribute('icon', 'lucide:grid');
      }
      renderSimulations();
    };

    // Main render function for simulation cards
    function renderSimulations() {
      const row = document.getElementById('sim-row');
      row.innerHTML = '';
      
      const filtered = simulations.filter(sim => {
        const matchesCategory = activeCategory === 'all' || sim.category === activeCategory;
        const matchesSearch = !searchQuery || 
          sim.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          sim.subtitle.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (sim.description && sim.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
          sim.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
          
        return matchesCategory && matchesSearch;
      });

      const isGrid = viewMode === 'grid';
      
      // Update visibility of navigation controls based on layout mode
      const rowArrows = document.querySelectorAll('.row-arrow');
      rowArrows.forEach(arrow => {
        if (isGrid) {
          arrow.classList.add('hidden');
        } else {
          arrow.classList.remove('hidden');
        }
      });
      
      const scrollLeftBtn = document.getElementById('scroll-left-btn');
      const scrollRightBtn = document.getElementById('scroll-right-btn');
      if (scrollLeftBtn && scrollRightBtn) {
        if (isGrid) {
          scrollLeftBtn.classList.add('hidden');
          scrollRightBtn.classList.add('hidden');
        } else {
          scrollLeftBtn.classList.remove('hidden');
          scrollRightBtn.classList.remove('hidden');
        }
      }

      // Re-apply layout class
      if (isGrid) {
        row.className = 'sim-row grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 px-6 max-w-7xl mx-auto transition-all duration-500';
      } else {
        row.className = 'sim-row scrollbar-hide flex gap-5 overflow-x-auto px-6 transition-all duration-500';
      }

      if (filtered.length === 0) {
        row.innerHTML = `
          <div class="flex items-center justify-center w-full py-20 col-span-full">
            <div class="text-center">
              <iconify-icon icon="lucide:flask-conical" width="40" class="text-neutral-700 mb-4 mx-auto block"></iconify-icon>
              <p class="text-sm text-neutral-500 font-light italic">No simulations found matching your criteria.</p>
            </div>
          </div>
        `;
        return;
      }

      filtered.forEach((sim, i) => {
        const card = document.createElement('a');
        card.href = sim.url;
        
        // Use full width in grid mode, fixed width in row mode
        const widthClasses = isGrid ? 'w-full' : 'flex-shrink-0 w-[300px] sm:w-[340px] lg:w-[380px]';
        card.className = `sim-card relative ${widthClasses} rounded-2xl overflow-hidden border border-white/10 hover:border-white/25 bg-[#0a0d18]/50 backdrop-blur-md hover:bg-[#0f1424]/70 shadow-glass-edge-subtle cursor-pointer group transition-all duration-tactile opacity-0 animate-fade-in-up flex flex-col justify-between`;
        card.style.animationDelay = `${100 + i * 50}ms`;

        const isFeatured = sim === featured;

        card.innerHTML = `
          <div>
            <div class="relative aspect-video overflow-hidden bg-brand-gray">
              <img src="${sim.image}" alt="${sim.title}" class="w-full h-full ${sim.imageClass || 'object-cover'} transition-transform duration-700 group-hover:scale-105" loading="lazy" onerror="if(this.src.indexOf('Screenshot.png')!==-1){this.src='./landscape_of_futures.png';}">
              ${isFeatured ? `<div class="absolute top-3 left-3 px-2.5 py-0.5 rounded-full bg-white text-black text-[9px] font-semibold tracking-wider uppercase shadow-button-physical">Featured</div>` : ''}
              <div class="card-overlay absolute inset-0 bg-black/40 flex items-center justify-center">
                <div class="w-14 h-14 rounded-full bg-white/90 flex items-center justify-center shadow-button-physical transform scale-75 group-hover:scale-100 transition-transform duration-tactile">
                  <iconify-icon icon="lucide:play" width="22" class="text-black ml-0.5"></iconify-icon>
                </div>
              </div>
            </div>
            <div class="p-5">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-[9px] font-mono text-neutral-600 tracking-wider uppercase">${sim.badge}</span>
                <span class="text-neutral-700">·</span>
                <span class="text-[9px] font-mono text-neutral-600 tracking-wider">${sim.year}</span>
                ${sim.category ? `<span class="text-neutral-700">·</span><span class="text-[9px] font-mono text-indigo-400/80 tracking-wider uppercase">${sim.category}</span>` : ''}
              </div>
              <h3 class="font-serif text-base font-medium tracking-tight mb-1.5 group-hover:text-white transition-colors text-neutral-200">${sim.title}</h3>
              <p class="text-xs text-neutral-500 font-light leading-relaxed line-clamp-2">${sim.subtitle}</p>
            </div>
          </div>
          <div class="p-5 pt-0">
            <div class="flex flex-wrap gap-1.5 mt-3">
              ${sim.tags.slice(0, 3).map((t, ti) => `<span class="text-[9px] font-medium tracking-wider uppercase text-neutral-600">${t}</span>${ti < Math.min(sim.tags.length, 3) - 1 ? '<span class="text-neutral-700 text-[9px]">·</span>' : ''}`).join('')}
            </div>
          </div>
        `;

        row.appendChild(card);
      });
    }

    window.scrollRow = function(direction) {
      const r = document.getElementById('sim-row');
      r.scrollBy({ left: direction * 400, behavior: 'smooth' });
    };

    const menuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => mobileMenu.classList.add('hidden'));
    });

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });

    // Wire up search input listener
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderSimulations();
    });

    // Initial load
    renderFilterTabs();
    renderSimulations();
  </script>

  <!-- Deep Space Fluidity & Interactive Ripples Engine -->
  <script src="./water-fluidity.js"></script>
</body>
</html>
