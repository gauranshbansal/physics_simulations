<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test Pure Canvas Cavitation Engine</title>
<style>
  body { margin:0; background:#030508; color:#fff; font-family:sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  .info { position:fixed; top:20px; left:20px; color:#64748b; font-family:monospace; font-size:12px; pointer-events:none; }
</style>
</head>
<body>
<div class="info">PURE CANVAS CAVITATION ENGINE (CLOCK-TIMED, RETINA-SCALED, ZERO DOM, NO SHADOWBLUR) &mdash; CLICK ANYWHERE</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const clicks = [];

window.addEventListener('pointerdown', (e) => {
  if (clicks.length >= 8) clicks.shift();
  clicks.push({ x: e.clientX, y: e.clientY, startTime: performance.now() });
});

function draw(now) {
  ctx.clearRect(0, 0, W, H);

  // Background subtle guide for visibility
  ctx.strokeStyle = 'rgba(6,182,212,0.04)';
  ctx.lineWidth = 1;
  for (let y = 40; y < H; y += 50) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  for (let i = clicks.length - 1; i >= 0; i--) {
    const c = clicks[i];
    const elapsed = now - c.startTime;

    if (elapsed >= 520) {
      clicks.splice(i, 1);
      continue;
    }

    const x = c.x;
    const y = c.y;

    if (elapsed < 85) {
      // Phase 1: Expansion under acoustic tension (0 -> 85ms)
      const p = elapsed / 85;
      const ease = 1 - Math.pow(1 - p, 2.2);
      const r = Math.max(1, 16 * ease);

      // Acoustic tension glow (radial gradient)
      const glow = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 1.8);
      glow.addColorStop(0, 'rgba(6, 182, 212, 0.45)');
      glow.addColorStop(0.6, 'rgba(6, 182, 212, 0.15)');
      glow.addColorStop(1, 'rgba(6, 182, 212, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, r * 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Bubble body gradient
      const bodyGrad = ctx.createRadialGradient(x, y, 0, x, y, r);
      bodyGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
      bodyGrad.addColorStop(0.5, 'rgba(6, 182, 212, 0.35)');
      bodyGrad.addColorStop(1, 'rgba(6, 182, 212, 0.15)');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // Bubble crisp outer border
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();

    } else if (elapsed < 120) {
      // Phase 2: Violent Rayleigh-Plesset Implosion & Sonoluminescence (85 -> 120ms)
      const p = (elapsed - 85) / 35;
      const collapseEase = Math.pow(p, 3.2);
      const r = Math.max(1.2, 16 * (1 - collapseEase * 0.92));

      // Sonoluminescent brilliant collapse flash
      const flashIntensity = Math.sin(p * Math.PI);
      const flashGrad = ctx.createRadialGradient(x, y, 0, x, y, 28);
      flashGrad.addColorStop(0, `rgba(255, 255, 255, ${0.95 * flashIntensity})`);
      flashGrad.addColorStop(0.3, `rgba(6, 182, 212, ${0.75 * flashIntensity})`);
      flashGrad.addColorStop(1, 'rgba(6, 182, 212, 0)');
      ctx.fillStyle = flashGrad;
      ctx.beginPath();
      ctx.arc(x, y, 28, 0, Math.PI * 2);
      ctx.fill();

      // Pinpoint white hot center
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // Phase 3: Acoustic Shockwave Release (120 -> 520ms, duration 400ms)
      const p = (elapsed - 120) / 400;
      const waveEase = 1 - Math.pow(1 - p, 1.8);
      const r = 4 + 56 * waveEase; // Reaches ~60px
      const alpha = Math.pow(1 - p, 1.4);

      // Primary cyan acoustic ring with soft gradient aura
      const ringGlow = ctx.createRadialGradient(x, y, Math.max(0, r - 5), x, y, r + 5);
      ringGlow.addColorStop(0, 'rgba(6, 182, 212, 0)');
      ringGlow.addColorStop(0.5, `rgba(6, 182, 212, ${0.3 * alpha})`);
      ringGlow.addColorStop(1, 'rgba(6, 182, 212, 0)');
      ctx.fillStyle = ringGlow;
      ctx.beginPath();
      ctx.arc(x, y, r + 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = `rgba(6, 182, 212, ${alpha * 0.95})`;
      ctx.lineWidth = Math.max(0.6, 1.8 * alpha);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();

      // Secondary rebound wave: thinner, razor-sharp white circle
      if (p > 0.06) {
        const pSub = (p - 0.06) / 0.94;
        const subR = r * 0.65;
        const subAlpha = Math.pow(1 - pSub, 1.3);

        ctx.strokeStyle = `rgba(255, 255, 255, ${subAlpha * 0.72})`;
        ctx.lineWidth = 0.85; // crisp thin stroke
        ctx.beginPath();
        ctx.arc(x, y, subR, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
